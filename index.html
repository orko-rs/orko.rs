<!doctype html>
<html>
    <head>
        <title>Orko — Agent orchestration toolkit for Rust</title>
        <meta charset="UTF-8" />
        <meta content="text/html;charset=utf-8" http-equiv="Content-Type" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="stylesheet" href="/assets/main.css" />
        <style>
            body {
                margin: 0;
                background: #f4f5f2;
            }

            #loader {
                position: fixed;
                inset: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 18px;
                background: #f4f5f2;
            }

            #loader img {
                width: 56px;
                height: 56px;
            }

            #loader .spinner {
                width: 22px;
                height: 22px;
                border: 2px solid #e2e5e0;
                border-top-color: #234bb6;
                border-radius: 50%;
                animation: orko-spin 0.8s linear infinite;
            }

            @keyframes orko-spin {
                to {
                    transform: rotate(360deg);
                }
            }

            #main > #loader:not(:only-child) {
                display: none;
            }
        </style>
    </head>
    <body>
        <div id="main">
            <div id="loader">
                <img src="/assets/orko_logo.svg" alt="Loading Orko" />
                <div class="spinner"></div>
            </div>
        </div>
    </body>
</html>
